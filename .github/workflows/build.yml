
name: Build Dreams Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name dreams_tracker --org com.suhebtaha.dreamstracker .

      - name: Install dependencies
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dreams-tracker-current-apk
          path: build/app/outputs/flutter-apk/app-release.apk
