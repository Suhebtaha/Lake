name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project files
        run: flutter create --project-name dream_tracker --org com.example.dreamtracker .

      - name: Use my app code
        run: cp main.dart lib/main.dart

      - name: Add dependency
        run: flutter pub add shared_preferences

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dream-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
