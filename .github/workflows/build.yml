name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create Flutter project
        run: flutter create --project-name dream_tracker --org com.example.dreamtracker .

      - name: Unpack app code and icon
        run: |
          for z in ./*.zip; do
            if [ -e "$z" ]; then unzip -o "$z"; fi
          done
          test -f lib/models.dart

      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="Dream Tracker"/' android/app/src/main/AndroidManifest.xml

      - name: Dependencies and icon
        run: |
          flutter pub add shared_preferences
          flutter pub add dev:flutter_launcher_icons
          cat >> pubspec.yaml <<'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            adaptive_icon_background: "assets/icon_bg.png"
            adaptive_icon_foreground: "assets/icon_fg.png"
          EOF
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dream-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
