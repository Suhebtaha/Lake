name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create Flutter project
        run: flutter create --project-name dream_tracker --org com.example.dreamtracker .

      - name: Unpack newest app zip
        run: |
          zip=$(git -c core.quotepath=off log --name-only --diff-filter=AM --format= -- '*.zip' | head -n 1)
          echo "Using: $zip"
          unzip -o "$zip"
          test -f ci/build.sh

      - name: Build
        run: bash ci/build.sh

      - name: Show report
        if: always()
        run: cat build_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dream-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk

          
